apiVersion: batch/v1
kind: Job
metadata:
  name: trip-planner-migrations
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: trip-planner-migrations
    spec:
      restartPolicy: Never
      containers:
        - name: migrations
          image: trip-planner-api-migrate-local
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              value: postgres://eb:eb@postgres:5432/eastbay?sslmode=disable
